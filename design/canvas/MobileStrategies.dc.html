<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #6C7BFA; } a:hover { color: #4F5FE0; }
    .h { font-family: 'Space Grotesk', system-ui, sans-serif; }
    .m { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 500; }
    .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 500; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.frame}}; color: {{t.textOnLight}};">

  <div style="padding: 50px 16px 100px; display: flex; flex-direction: column; gap: 10px;">

    <div style="height: 44px; display: flex; align-items: center; justify-content: space-between;">
      <div>
        <div class="h" style="font-size: 22px; font-weight: 600; letter-spacing: -0.01em;">Strategies</div>
        <div style="font-size: 11.5px; color: {{t.subOnLight}};">5 total</div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <div style="width: 34px; height: 34px; border-radius: 999px; background: {{t.cardLight}}; border: 1px solid {{t.cardLightBorder}}; display: flex; align-items: center; justify-content: center; color: {{t.navText}};">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6 H20 M4 12 H20 M4 18 H14"/></svg>
        </div>
        <div style="width: 34px; height: 34px; border-radius: 999px; background: {{t.cardLight}}; border: 1px solid {{t.cardLightBorder}}; display: flex; align-items: center; justify-content: center; color: {{t.navText}};">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2 V5 M12 19 V22 M4.2 4.2 L6.3 6.3 M17.7 17.7 L19.8 19.8 M2 12 H5 M19 12 H22 M4.2 19.8 L6.3 17.7 M17.7 6.3 L19.8 4.2"/></svg>
        </div>
        <div style="width: 34px; height: 34px; border-radius: 999px; border: 1px solid rgba(242,85,90,0.45); background: {{t.cardLight}}; display: flex; align-items: center; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F2555A" stroke-width="2.4" stroke-linecap="round"><path d="M12 2 V11"/><path d="M7 5.5 A9 9 0 1 0 17 5.5"/></svg>
        </div>
      </div>
    </div>

    <sc-for list="{{strategies}}" as="s" hint-placeholder-count="5">
      <div style="border-radius: 16px; padding: 12px 14px; background: {{t.cardLight}}; border: {{s.border}};">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div class="h" style="font-size: 13.5px; font-weight: 600;">{{s.name}}</div>
          <span style="font-size: 9.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: {{s.styleBg}}; color: {{s.styleColor}};">{{s.style}}</span>
        </div>
        <div style="display: flex; gap: 5px; margin-top: 6px;">
          <span style="font-size: 9.5px; padding: 2px 6px; border-radius: 999px; background: {{s.liveBg}}; color: {{s.liveColor}};">{{s.liveLabel}}</span>
          <span style="font-size: 9.5px; padding: 2px 6px; border-radius: 999px; background: {{t.chipBg}}; color: {{t.subOnLight}};">{{s.approvalLabel}}</span>
        </div>
        <div style="display: flex; gap: 12px; margin-top: 6px; font-size: 10.5px; color: {{t.subOnLight}};">
          <span><span class="m" style="color: {{t.textOnLight}};">{{s.win}}</span> win</span>
          <span><span class="m" style="color: {{s.avgColor}};">{{s.avg}}</span> avg</span>
          <span><span class="m" style="color: {{t.textOnLight}};">{{s.trades}}</span> trades</span>
        </div>
      </div>
    </sc-for>

    <div style="height: 42px; border-radius: 999px; border: 1px dashed {{t.chipBorder}}; color: {{t.subOnLight}}; font-size: 12.5px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5 V19 M5 12 H19"/></svg>
      <span>New strategy</span>
    </div>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 10px 12px 26px; background: {{t.cardLight}}; border-top: 1px solid {{t.cardLightBorder}}; display: flex; align-items: center;">
    <div class="tab" style="color: {{t.navText}};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg><span>Overview</span></div>
    <div class="tab" style="position: relative; color: {{t.navText}};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5 L11 15.5 L16 9.5"/></svg><span>Approvals</span><div class="m" style="position: absolute; top: -4px; right: 14px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: #6C7BFA; color: #0B0C0F; font-size: 9.5px; display: flex; align-items: center; justify-content: center;">3</div></div>
    <div class="tab" style="color: {{t.textOnLight}};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L21 8 L12 13 L3 8 Z"/><path d="M3 13 L12 18 L21 13"/></svg><span>Strategies</span></div>
    <div class="tab" style="color: {{t.navText}};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7 V12 L15.5 14"/></svg><span>Backtest</span></div>
    <div class="tab" style="color: {{t.navText}};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 L14 9.5 L21 12 L14 14.5 L12 21 L10 14.5 L3 12 L10 9.5 Z"/></svg><span>Insights</span></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","default":"light","options":["light","dark"]}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const light = {
      frame: '#F3F2EF', cardLight: '#FFFFFF', cardLightBorder: '#E6E3DC', textOnLight: '#141519', subOnLight: '#6B7079',
      cardDark: '#111214', cardDarkBorder: '#111214', textOnDark: '#F4F5F7', subOnDark: '#9BA1AC', pos: '#7FF5CC', neg: '#FF8FCB', greenText: '#0E8C66', pinkText: '#C8368A', s1: '#C4B5FD', s2: '#8FE3FF', s3: '#FFE38A',
      chipBg: '#F3F2EF', chipBorder: '#E6E3DC',
      navPillBg: '#111214', navPillText: '#F4F5F7', navText: '#6B7079',
      rangeActiveBg: '#F4F5F7', rangeActiveText: '#111214',
    };
    const dark = {
      frame: '#0B0C0F', cardLight: '#141519', cardLightBorder: '#262A31', textOnLight: '#F4F5F7', subOnLight: '#9BA1AC',
      cardDark: '#101114', cardDarkBorder: '#262A31', textOnDark: '#F4F5F7', subOnDark: '#9BA1AC', pos: '#7FF5CC', neg: '#FF8FCB', greenText: '#7FF5CC', pinkText: '#FF8FCB', s1: '#C4B5FD', s2: '#8FE3FF', s3: '#FFE38A',
      chipBg: '#1B1E24', chipBorder: '#262A31',
      navPillBg: '#6C7BFA', navPillText: '#0B0C0F', navText: '#9BA1AC',
      rangeActiveBg: '#6C7BFA', rangeActiveText: '#0B0C0F',
    };
    const t = theme === 'dark' ? dark : light;
    const tradingStyle = { bg: 'rgba(196,181,253,0.22)', color: '#8B6FE8' };
    const investStyle = { bg: 'rgba(143,227,255,0.2)', color: '#3E97B3' };
    const strategies = [
      { name: 'Low-Vol Compounder', style: 'investment', styleBg: investStyle.bg, styleColor: investStyle.color, border: '1.5px solid #6C7BFA', liveLabel: 'Live-enabled', liveBg: 'rgba(127,245,204,0.22)', liveColor: t.greenText, approvalLabel: 'Auto above 0.80', win: '63%', avg: '+1.8%', avgColor: t.greenText, trades: '96' },
      { name: 'Volatility Harvester', style: 'trading', styleBg: tradingStyle.bg, styleColor: tradingStyle.color, border: '1px solid ' + t.cardLightBorder, liveLabel: 'Demo only', liveBg: t.chipBg, liveColor: t.subOnLight, approvalLabel: 'Manual', win: '48%', avg: '−0.6%', avgColor: t.pinkText, trades: '52' },
      { name: 'Trend Follower', style: 'trading', styleBg: tradingStyle.bg, styleColor: tradingStyle.color, border: '1px solid ' + t.cardLightBorder, liveLabel: 'Demo only', liveBg: t.chipBg, liveColor: t.subOnLight, approvalLabel: 'Auto above 0.75', win: '55%', avg: '+1.1%', avgColor: t.greenText, trades: '41' },
      { name: 'Volatility Breakout', style: 'trading', styleBg: tradingStyle.bg, styleColor: tradingStyle.color, border: '1px solid ' + t.cardLightBorder, liveLabel: 'Demo only', liveBg: t.chipBg, liveColor: t.subOnLight, approvalLabel: 'Manual', win: '46%', avg: '+0.4%', avgColor: t.greenText, trades: '28' },
      { name: 'Value/Quality Dip-Buyer', style: 'investment', styleBg: investStyle.bg, styleColor: investStyle.color, border: '1px solid ' + t.cardLightBorder, liveLabel: 'Demo only', liveBg: t.chipBg, liveColor: t.subOnLight, approvalLabel: 'Manual', win: '67%', avg: '+2.4%', avgColor: t.greenText, trades: '19' },
    ];
    return { t, strategies };
  }
}
</script>
</body>
</html>
