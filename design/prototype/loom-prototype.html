        ? '<div style="margin-bottom:12px;"><input type="text" data-action="note-input" data-id="' + s.id + '" value="' + esc(s.note) + '" placeholder="Why? (optional)" style="width:100%;height:38px;border-radius:10px;border:1px solid var(--chip-border);background:var(--chip);padding:0 12px;font-size:13px;color:var(--text);font-family:inherit;" /></div>'
        : '<button data-action="note-toggle" data-id="' + s.id + '" style="display:flex;align-items:center;gap:6px;width:100%;height:30px;padding:0 10px;border-radius:9px;border:1px dashed var(--chip-border);background:none;color:var(--sub);font-size:11.5px;margin-bottom:12px;">' + ICON.note + '<span>' + (s.note ? '“' + esc(s.note) + '”' : 'Add a quick note (optional)') + '</span></button>') +

        '<button class="btn-primary" style="flex:1;" data-action="approve" data-id="' + s.id + '" ' + (state.kill ? 'disabled' : '') + '>Approve</button>' +

  function renderApprovals() {

      return '<div class="card" style="padding:60px 24px;text-align:center;">' +
        '<div class="h" style="font-size:20px;font-weight:600;">Queue is empty</div>' +
        '<div style="font-size:13px;color:var(--sub);margin-top:8px;">Nothing waiting on you right now — approved and rejected signals move to History.</div>' +
        '<button class="btn-primary" style="margin:20px auto 0;padding:0 20px;width:auto;" data-action="nav" data-view="history">View History</button>' +
      '</div>';
    }
    return '<div class="grid12">' +
      '<div class="span-7" style="display:flex;flex-direction:column;gap:12px;">' +
        '<div style="display:flex;align-items:flex-end;justify-content:space-between;padding:0 4px;"><div class="h" style="font-size:22px;font-weight:600;">Waiting for you</div><div style="font-size:13px;color:var(--sub);">' + PENDING.length + ' signal' + (PENDING.length === 1 ? '' : 's') + '</div></div>' +
        PENDING.map(function (s) { return signalCard(s, s === PENDING[0]); }).join('') +
      '</div>' +
      '<div class="span-5 card" style="padding:16px 20px;">' +
        '<div class="h" style="font-size:14px;font-weight:600;margin-bottom:10px;">Decided today</div>' +
        DECIDED.map(function (d) {
          return '<div style="padding:10px 0;border-top:1px solid var(--divider);font-size:12.5px;">' +
            '<div style="display:flex;align-items:center;gap:10px;"><span class="chip" style="background:' + (d.status === 'Executed' ? 'rgba(127,245,204,0.22)' : 'rgba(108,123,250,0.16)') + ';color:' + (d.status === 'Executed' ? 'var(--green-text)' : 'var(--indigo-text)') + ';width:70px;text-align:center;">' + d.status + '</span>' +
            '<span style="font-weight:600;">' + d.ticker + ' · ' + d.action + ' ' + d.qty + '</span></div>' +
            '<div style="color:var(--sub);margin-top:4px;">' + d.detail + (d.note ? ' · <span style="font-style:italic;">“' + esc(d.note) + '”</span>' : '') + '</div>' +
          '</div>';
        }).join('') +
        (!DECIDED.length ? '<div style="font-size:12.5px;color:var(--sub);padding:10px 0;">Nothing decided yet today.</div>' : '') +
      '</div>' +
    '</div>';
  }

  /* ---------- STRATEGIES ---------- */

  function renderStrategies() {
    return '<div class="grid12">' +
      '<div class="span-4" style="display:flex;flex-direction:column;gap:10px;">' +
        '<div style="display:flex;align-items:flex-end;justify-content:space-between;padding:0 4px;"><div class="h" style="font-size:24px;font-weight:600;">Strategies</div><div style="font-size:12.5px;color:var(--sub);">5 total</div></div>' +
        STRAT.map(function (s) {
          var sel = s.id === state.selectedStrategy;
          var styleColor = s.style === 'investment' ? '#3E97B3' : '#8B6FE8';
          var styleBg = s.style === 'investment' ? 'rgba(143,227,255,0.2)' : 'rgba(196,181,253,0.22)';
          return '<button data-action="select-strategy" data-id="' + s.id + '" style="text-align:left;border-radius:18px;padding:14px 16px;background:var(--card);border:' + (sel ? '1.5px solid var(--indigo)' : '1px solid var(--card-border)') + ';font-family:inherit;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;"><div class="h" style="font-size:14.5px;font-weight:600;color:var(--text);">' + s.name + '</div><span class="chip" style="background:' + styleBg + ';color:' + styleColor + ';">' + s.style + '</span></div>' +
            '<div style="display:flex;gap:6px;margin-top:8px;">' +
              '<span class="chip" style="' + (s.live ? 'background:rgba(127,245,204,0.22);color:var(--green-text);' : '') + '">' + (s.live ? 'Live-enabled' : 'Demo only') + '</span>' +
              '<span class="chip">' + (s.approval === 'auto-above' ? 'Auto above ' + s.threshold.toFixed(2) : 'Manual') + '</span>' +
            '</div>' +
            '<div style="display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--sub);"><span><span class="m" style="color:var(--text);">' + s.win + '%</span> win</span><span><span class="m" style="color:' + (s.avgUp ? 'var(--green-text)' : 'var(--pink-text)') + ';">' + s.avg + '</span> avg</span><span><span class="m" style="color:var(--text);">' + s.trades + '</span> trades</span></div>' +
          '</button>';
        }).join('') +
        '<div style="height:44px;border-radius:999px;border:1px dashed var(--chip-border);color:var(--sub);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;">' + ICON.plus + '<span>New strategy</span></div>' +
      '</div>' +
      '<div class="span-8">' + strategyDetailPanel(stratById(state.selectedStrategy)) + '</div>' +
    '</div>';
  }

  function strategyDetailPanel(st) {
    return '<div style="display:flex;flex-direction:column;gap:16px;">' +
      '<div class="card-dark" style="padding:22px 24px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;">' +
          '<div><div style="display:flex;align-items:center;gap:10px;"><div class="h" style="font-size:24px;font-weight:600;">' + st.name + '</div>' +
          '<span class="chip" style="background:rgba(143,227,255,0.2);color:#6FC7E0;">' + st.style + '</span></div>' +
          '<div style="font-size:13px;color:var(--sub-on-dark);margin-top:6px;max-width:52ch;">' + st.blurb + '</div></div>' +
          '<div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">' +
            '<span style="font-size:12.5px;color:var(--sub-on-dark);">Live-enabled</span>' +
            '<button data-action="toggle-live" data-id="' + st.id + '" style="width:40px;height:22px;border-radius:999px;border:none;background:' + (st.live ? '#7FF5CC' : 'rgba(255,255,255,0.15)') + ';position:relative;">' +
              '<span style="width:18px;height:18px;border-radius:999px;background:' + (st.live ? '#0B0C0F' : '#F4F5F7') + ';position:absolute;top:2px;left:' + (st.live ? '20px' : '2px') + ';"></span></button>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;gap:8px;margin-top:16px;">' +
          ['manual', 'auto-above', 'auto'].map(function (m) {
            var label = m === 'manual' ? 'Manual' : m === 'auto-above' ? 'Auto above…' : 'Auto';
            return '<button data-action="set-approval" data-id="' + st.id + '" data-mode="' + m + '" style="flex:1;padding:8px 0;border-radius:999px;border:none;font-size:12.5px;font-weight:' + (st.approval === m ? '600' : '400') + ';background:' + (st.approval === m ? 'var(--range-active-bg)' : 'rgba(255,255,255,0.06)') + ';color:' + (st.approval === m ? 'var(--range-active-text)' : 'var(--sub-on-dark)') + ';">' + label + '</button>';
          }).join('') +
        '</div>' +
        '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px;">' +
          rangeRow(st, 'threshold', 'Auto-approve above', '#7FF5CC') +
          rangeRow(st, 'notify', 'Notify (push) above', '#8B97FC') +
        '</div>' +
        '<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px;">' +
          statTile('Win rate', st.win + '%') + statTile('Avg return', st.avg, st.avgUp ? '#7FF5CC' : '#FF8FCB') + statTile('Drawdown', st.drawdown) + statTile('Trades', st.trades) +
        '</div>' +
      '</div>' +
      '<div class="card" style="padding:20px 22px;">' +
        '<div class="h" style="font-size:16px;font-weight:600;">Parameters</div>' +
        '<div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;">' +
          st.params.map(function (p) {
            return '<div style="display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;background:var(--chip);"><div class="m" style="font-size:15px;font-weight:600;width:120px;flex-shrink:0;">' + p.value + '</div><div><div style="font-size:13px;font-weight:600;">' + p.name + '</div><div style="font-size:12px;color:var(--sub);margin-top:2px;">' + p.desc + '</div></div></div>';
          }).join('') +
        '</div>' +
      '</div>' +
      '<div class="card" style="padding:20px 22px;">' +
        '<div class="h" style="font-size:16px;font-weight:600;">Version history</div>' +
        '<div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;">' +
          st.versions.map(function (v, i) {
            return '<div style="border-radius:16px;padding:14px 16px;background:var(--chip);' + (i === 0 ? 'border:1.5px solid var(--indigo);' : 'border:1px solid var(--chip-border);') + '">' +
              '<div style="display:flex;justify-content:space-between;"><span class="h" style="font-size:14px;font-weight:600;">' + v.v + '</span><span style="font-size:11px;color:var(--sub);">' + v.date + '</span></div>' +
              '<div style="font-size:12.5px;color:var(--sub);margin-top:6px;">' + v.note + '</div>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>' +
      strategyPerformancePanel(st) +
    '</div>';
  }

  function strategyPerformancePanel(st) {
    var tradesDisplay = TRADES[st.id] || [];
    var trades = tradesDisplay.slice().reverse();
    var stats = tradeStats(trades);
    var w = 720, h = 120, pad = 6;
    var cum = 0, pts = [0];
    trades.forEach(function (t) { cum += t.retPct; pts.push(cum); });
    var lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts);
    var range = (hi - lo) || 1;
    var stepX = (w - pad * 2) / (pts.length - 1 || 1);
    var path = pts.map(function (v, i) {
      var x = pad + i * stepX;
      var y = pad + (h - pad * 2) * (1 - (v - lo) / range);
      return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    var lastX = pad + (pts.length - 1) * stepX;
    var lastY = pad + (h - pad * 2) * (1 - (pts[pts.length - 1] - lo) / range);
    var barW = Math.min(48, (w - pad * 2) / trades.length - 8);
    var maxAbs = Math.max.apply(null, trades.map(function (t) { return Math.abs(t.retPct); }).concat([1]));

    return '<div class="card" style="padding:20px 22px;">' +
      '<div class="h" style="font-size:16px;font-weight:600;">Performance</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:14px;">' +
        statTileLight('Profit factor', stats.profitFactor) + statTileLight('Avg win', stats.avgWin, 'var(--green-text)') + statTileLight('Avg loss', stats.avgLoss, 'var(--pink-text)') + statTileLight('Best trade', stats.best ? stats.best.retPct.toFixed(1) + '%' : '—', 'var(--green-text)') + statTileLight('Avg hold', stats.avgHold) +
      '</div>' +
      '<div style="font-size:11.5px;color:var(--sub);margin-top:18px;margin-bottom:6px;">Cumulative return, trade by trade</div>' +
      '<svg width="100%" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="display:block;">' +
        '<line x1="' + pad + '" y1="' + (pad + (h - pad * 2) * (1 - (0 - lo) / range)).toFixed(1) + '" x2="' + (w - pad) + '" y2="' + (pad + (h - pad * 2) * (1 - (0 - lo) / range)).toFixed(1) + '" stroke="var(--divider)" stroke-width="1" stroke-dasharray="3,3"/>' +
        '<path d="' + path + '" fill="none" stroke="' + (pts[pts.length - 1] >= 0 ? 'var(--green-text)' : 'var(--pink-text)') + '" stroke-width="2.4" stroke-linejoin="round"/>' +
        '<circle cx="' + lastX.toFixed(1) + '" cy="' + lastY.toFixed(1) + '" r="4" fill="' + (pts[pts.length - 1] >= 0 ? 'var(--green-text)' : 'var(--pink-text)') + '"/>' +
      '</svg>' +
      '<div style="font-size:11.5px;color:var(--sub);margin-top:14px;margin-bottom:6px;">Return per trade</div>' +
      '<svg width="100%" height="90" viewBox="0 0 ' + w + ' 90" preserveAspectRatio="none" style="display:block;">' +
        '<line x1="0" y1="45" x2="' + w + '" y2="45" stroke="var(--divider)" stroke-width="1"/>' +
        trades.map(function (t, i) {
          var bh = (Math.abs(t.retPct) / maxAbs) * 38;
          var x = pad + i * ((w - pad * 2) / trades.length) + 4;
          var up = t.retPct >= 0;
          var y = up ? 45 - bh : 45;
          return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="2" fill="' + (up ? 'var(--green-text)' : 'var(--pink-text)') + '" opacity="' + (t.status === 'open' ? '0.5' : '1') + '"/>';
        }).join('') +
      '</svg>' +
      '<div class="table-wrap" style="margin-top:16px;">' +
        '<table><thead><tr><th>Date</th><th>Instrument</th><th>Entry</th><th>Exit</th><th>Return</th><th>Hold</th><th>Status</th></tr></thead><tbody>' +
        tradesDisplay.map(function (t) {
          return '<tr><td class="m" style="color:var(--sub);white-space:nowrap;">' + t.date + '</td>' +
            '<td><span style="font-weight:600;">' + t.ticker + '</span> <span style="color:var(--sub);font-size:11px;">' + t.action + '</span></td>' +
            '<td class="m">£' + t.entry.toFixed(2) + '</td>' +
            '<td class="m">' + (t.exit ? '£' + t.exit.toFixed(2) : '—') + '</td>' +
            '<td class="m" style="color:' + (t.retPct >= 0 ? 'var(--green-text)' : 'var(--pink-text)') + ';">' + (t.retPct >= 0 ? '+' : '') + t.retPct.toFixed(1) + '% <span style="color:var(--sub);">(' + (t.retGBP >= 0 ? '+' : '−') + '£' + Math.abs(t.retGBP).toFixed(2) + ')</span></td>' +
            '<td class="m" style="color:var(--sub);">' + t.hold + 'd</td>' +
            '<td><span class="chip" style="' + (t.status === 'open' ? 'background:rgba(108,123,250,0.14);color:var(--indigo-text);' : '') + '">' + (t.status === 'open' ? 'Open' : 'Closed') + '</span></td></tr>';
        }).join('') +
        '</tbody></table>' +
      '</div>' +
    '</div>';
  }
  function statTileLight(label, value, color) {
    return '<div style="padding:12px 12px;border-radius:14px;background:var(--chip);"><div style="font-size:10.5px;color:var(--sub);">' + label + '</div><div class="h" style="font-size:17px;font-weight:600;margin-top:4px;' + (color ? 'color:' + color + ';' : '') + '">' + value + '</div></div>';
  }

  function rangeRow(st, kind, label, color) {
    var val = kind === 'threshold' ? st.threshold : st.notify;
    return '<div style="padding:14px 16px;border-radius:14px;background:rgba(255,255,255,0.06);">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:12px;color:var(--sub-on-dark);">' + label + '</span><span class="m" style="font-size:14px;font-weight:600;">' + val.toFixed(2) + '</span></div>' +
      '<input type="range" min="0.5" max="1" step="0.01" value="' + val + '" data-action="range" data-id="' + st.id + '" data-kind="' + kind + '" style="width:100%;margin-top:10px;" />' +
    '</div>';
  }
  function statTile(label, value, color) {
    return '<div style="padding:12px 14px;border-radius:14px;background:rgba(255,255,255,0.06);"><div style="font-size:11px;color:var(--sub-on-dark);">' + label + '</div><div class="h" style="font-size:20px;font-weight:600;margin-top:4px;' + (color ? 'color:' + color + ';' : '') + '">' + value + '</div></div>';
  }

  /* ---------- BACKTEST ---------- */

  function renderBacktest() {
    var res = BACKTEST_RESULTS[state.backtestVersion];
    return '<div class="grid12">' +
      '<div class="span-4 card" style="padding:20px 22px;display:flex;flex-direction:column;gap:14px;">' +
        '<div class="h" style="font-size:20px;font-weight:600;">Backtest</div>' +
        formField('Strategy', STRAT.map(function (s) { return { id: s.id, label: s.name }; }), state.backtestStrategy, 'backtest-strategy', true) +
        formField('Config version', [{ id: 'v3', label: 'v3 · current' }, { id: 'v2', label: 'v2' }, { id: 'draft', label: '+ draft' }], state.backtestVersion, 'backtest-version', false) +
        formField('Window', [{ id: '1Y', label: '1Y' }, { id: '3Y', label: '3Y' }, { id: '5Y', label: '5Y' }, { id: 'Max', label: 'Max' }], state.backtestWindow, 'backtest-window', false) +
        '<button class="btn-primary" data-action="run-backtest">' + (state.backtestRunning ? 'Running…' : 'Run backtest') + '</button>' +
      '</div>' +
      '<div class="span-8" style="display:flex;flex-direction:column;gap:12px;">' +
        '<div class="card-dark" style="padding:22px 24px 16px;">' +
          '<div style="font-size:12.5px;color:var(--sub-on-dark);">' + state.backtestVersion + ' · ' + stratById(state.backtestStrategy).name + ' · ' + state.backtestWindow + ' · from £10,000</div>' +
          '<div class="h" style="font-size:34px;font-weight:600;letter-spacing:-0.02em;line-height:1;margin-top:8px;">' + res.headline + ' <span style="font-size:17px;color:#7FF5CC;">' + res.pct + '</span></div>' +
          '<svg width="100%" height="130" viewBox="0 0 800 130" preserveAspectRatio="none" style="margin-top:14px;">' +
            '<path d="M0,110 L67,100 L133,104 L200,88 L267,92 L333,72 L400,76 L467,56 L533,60 L600,40 L667,44 L733,24 L800,16" fill="none" stroke="#7FF5CC" stroke-width="2.4" stroke-linejoin="round"/>' +
          '</svg>' +
        '</div>' +
        '<div class="grid12" style="gap:10px;">' +
          '<div class="span-3 card" style="padding:14px 16px;"><div style="font-size:11px;color:var(--sub);">Total return</div><div class="h" style="font-size:19px;font-weight:600;margin-top:4px;color:var(--green-text);">' + res.pct + '</div></div>' +
          '<div class="span-3 card" style="padding:14px 16px;"><div style="font-size:11px;color:var(--sub);">Win rate</div><div class="h" style="font-size:19px;font-weight:600;margin-top:4px;">' + res.win + '</div></div>' +
          '<div class="span-3 card" style="padding:14px 16px;"><div style="font-size:11px;color:var(--sub);">Max drawdown</div><div class="h" style="font-size:19px;font-weight:600;margin-top:4px;">' + res.dd + '</div></div>' +
          '<div class="span-3 card" style="padding:14px 16px;"><div style="font-size:11px;color:var(--sub);">Sharpe</div><div class="h" style="font-size:19px;font-weight:600;margin-top:4px;">' + res.sharpe + '</div></div>' +
        '</div>' +
      '</div>' +
    '</div>';

  function formField(label, options, current, action, wrap) {
    return '<div><div style="font-size:11.5px;color:var(--sub);margin-bottom:6px;">' + label + '</div>' +
      '<div style="display:flex;gap:6px;' + (wrap ? 'flex-wrap:wrap;' : '') + '">' +
      options.map(function (o) {
        var on = o.id === current;
        return '<button data-action="' + action + '" data-id="' + o.id + '" style="flex:' + (wrap ? '0 0 auto' : '1') + ';text-align:center;padding:8px 12px;border-radius:999px;font-size:12.5px;font-weight:' + (on ? '600' : '400') + ';background:' + (on ? 'var(--nav-pill-bg)' : 'var(--chip)') + ';color:' + (on ? 'var(--nav-pill-text)' : 'var(--sub)') + ';border:1px solid ' + (on ? 'transparent' : 'var(--chip-border)') + ';">' + o.label + '</button>';
      }).join('') + '</div></div>';
  }

  /* ---------- INSIGHTS ---------- */

  function renderInsights() {
    return '<div class="grid12">' +
      '<div class="span-7" style="display:flex;flex-direction:column;gap:14px;">' +
        '<div><div class="h" style="font-size:24px;font-weight:600;">Ask about anything you hold — or might</div><div style="font-size:13px;color:var(--sub);margin-top:4px;">Research with sources. Insights inform you; they never place a trade.</div></div>' +
        '<div style="display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;border-radius:999px;background:var(--card);border:1px solid var(--card-border);">' +
          ICON.insights +
          '<input type="text" id="ask-input" value="' + esc(state.askText) + '" placeholder="Why is VWRL down this week?" style="flex:1;border:none;background:none;font-size:14px;color:var(--text);font-family:inherit;" data-action="ask-input" />' +
          '<button data-action="ask" class="btn-primary" style="width:auto;padding:0 20px;">Ask</button>' +
        '</div>' +
        (state.askAnswer ? '<div class="card-dark" style="padding:24px;display:flex;flex-direction:column;gap:14px;">' +
          '<div style="display:flex;align-items:center;gap:8px;"><span class="chip" style="background:var(--indigo);color:#0B0C0F;">Insight</span><span style="font-size:11.5px;color:var(--sub-on-dark);">Advisory only · generated with web search</span></div>' +
          '<div class="h" style="font-size:19px;font-weight:600;">' + state.askAnswer.title + '</div>' +
          '<div style="font-size:14px;line-height:1.65;">' + state.askAnswer.body + '</div>' +
        '</div>' : '') +
      '</div>' +
      '<div class="span-5" style="display:flex;flex-direction:column;gap:10px;">' +
        '<div style="display:flex;align-items:flex-end;justify-content:space-between;"><div class="h" style="font-size:18px;font-weight:600;">Why each signal fired</div>' +
        '<div class="pill"><button data-action="insights-tab" data-id="signals" class="' + (state.insightsTab === 'signals' ? 'active' : '') + '">Signals</button><button data-action="insights-tab" data-id="digest" class="' + (state.insightsTab === 'digest' ? 'active' : '') + '">Digest</button></div></div>' +
        (state.insightsTab === 'digest'
          ? '<div class="card" style="padding:18px 20px;background:rgba(108,123,250,0.1);border-color:rgba(108,123,250,0.28);"><div class="h" style="font-size:14px;font-weight:600;margin-bottom:8px;">Today’s briefing</div><div style="font-size:13px;line-height:1.6;color:var(--sub);">' + DIGEST + '</div></div>'
          : PENDING.map(function (s) {
              return '<div class="card" style="padding:16px 18px;"><div style="display:flex;justify-content:space-between;align-items:center;"><div style="display:flex;align-items:center;gap:8px;"><span class="h" style="font-size:14.5px;font-weight:600;">' + s.ticker + ' · ' + s.action.toLowerCase() + '</span><span class="m" style="font-size:11.5px;color:var(--sub);">' + s.confidence.toFixed(2) + '</span></div><span style="font-size:11px;color:var(--sub);">' + s.fired + '</span></div>' +
              '<div style="font-size:13px;line-height:1.55;color:var(--sub);margin-top:8px;">' + insightBlurb(s) + '</div></div>';
            }).join('')) +
      '</div>' +
    '</div>';
  }
  function insightBlurb(s) {
    if (s.stratId === 'trend') return 'Three-day pullback to the 50-day average while relative strength against the sector stayed positive — historically a favourable entry for this strategy.';
    if (s.stratId === 'compounder') return 'Confidence is moderate: broad-market volatility ticked up this week, widening this strategy’s stop and shrinking the position it proposes.';
    return 'Already held and down −3.1% — adding here would compound the position; this action always requires your explicit manual approval.';
  }

  /* ---------- HISTORY ---------- */

  function renderHistory() {
    var rows = HISTORY_SEED.filter(function (r) { return state.historyEnvFilter === 'all' || r.env === state.historyEnvFilter; });
    return '<div style="display:flex;flex-direction:column;gap:16px;">' +
      '<div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px;"><div><div class="h" style="font-size:24px;font-weight:600;">History</div><div style="font-size:13px;color:var(--sub);margin-top:4px;">Every signal and order, kept for the record.</div></div></div>' +
      '<div style="display:flex;gap:8px;">' +
        '<button data-action="history-filter" data-id="all" class="chip" style="border:none;' + (state.historyEnvFilter === 'all' ? 'background:var(--nav-pill-bg);color:var(--nav-pill-text);' : 'background:var(--card);border:1px solid var(--card-border);') + '">All</button>' +
        '<button data-action="history-filter" data-id="demo" class="chip" style="border:none;' + (state.historyEnvFilter === 'demo' ? 'background:var(--nav-pill-bg);color:var(--nav-pill-text);' : 'background:var(--card);border:1px solid var(--card-border);') + '">Demo only</button>' +
        '<button data-action="history-filter" data-id="live" class="chip" style="border:none;' + (state.historyEnvFilter === 'live' ? 'background:var(--nav-pill-bg);color:var(--nav-pill-text);' : 'background:var(--card);border:1px solid var(--card-border);') + '">Live only</button>' +
      '</div>' +
      '<div class="grid12">' +
        '<div class="span-4 card" style="padding:14px 16px;"><div style="font-size:11px;color:var(--sub);">Net P&amp;L, closed</div><div class="h" style="font-size:20px;font-weight:600;margin-top:4px;color:var(--green-text);">+£412</div></div>' +
        '<div class="span-4 card" style="padding:14px 16px;"><div style="font-size:11px;color:var(--sub);">Rejected/expired</div><div class="h" style="font-size:20px;font-weight:600;margin-top:4px;">5</div></div>' +
        '<div class="span-4 card" style="padding:14px 16px;background:rgba(108,123,250,0.1);border-color:rgba(108,123,250,0.3);"><div style="font-size:11px;color:var(--indigo-text);">Your calls, in hindsight</div><div class="h" style="font-size:20px;font-weight:600;margin-top:4px;color:var(--indigo-text);">4 of 5 correct</div></div>' +
      '</div>' +
      '<div class="card table-wrap" style="padding:8px;">' +
        '<table><thead><tr><th>Date</th><th>Instrument</th><th>Strategy</th><th>Status</th><th>Outcome</th><th>Note</th></tr></thead><tbody>' +
        rows.map(function (r) {
          return '<tr><td class="m" style="color:var(--sub);white-space:nowrap;">' + r.date + '</td>' +
            '<td><div style="font-weight:600;">' + r.ticker + '</div><div style="display:flex;gap:5px;margin-top:3px;"><span class="chip" style="font-size:10px;">' + r.action + '</span>' + envBadge(r.env) + '</div></td>' +
            '<td style="color:var(--sub);">' + r.strat + '</td>' +
            '<td><span class="chip" style="background:' + (r.status === 'Executed' ? 'rgba(127,245,204,0.22)' : 'var(--chip)') + ';color:' + (r.status === 'Executed' ? 'var(--green-text)' : 'var(--sub)') + ';">' + r.status + '</span></td>' +
            '<td><div class="m" style="font-size:13px;color:' + colorFor(r.color) + ';">' + r.outcome + '</div><div style="font-size:10.5px;color:var(--sub);">' + r.outcomeLabel + '</div></td>' +
            '<td style="color:var(--sub);font-style:italic;max-width:220px;">' + esc(r.note) + '</td></tr>';
        }).join('') +
        '</tbody></table>' +
      '</div>' +
    '</div>';
  }

  /* ---------- SETTINGS ---------- */

  function renderSettings() {
    return '<div class="grid12">' +
      '<div class="span-5 card" style="padding:22px 24px;display:flex;flex-direction:column;gap:4px;">' +
        '<div class="h" style="font-size:16px;font-weight:600;margin-bottom:4px;">Risk limits</div>' +
        riskRow('Max position size', '15% of portfolio') +
        riskRow('Max total exposure', '80% of portfolio · at 61%') +
        riskRow('Daily loss limit', '£250.00') +
        '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;"><div><div style="font-size:13.5px;font-weight:500;">Halt on daily limit breach</div><div style="font-size:11.5px;color:var(--sub);margin-top:2px;">Recommended — off means only a notification is sent.</div></div>' +
        '<button data-action="toggle-simple" data-id="haltOnBreach" style="width:40px;height:22px;border-radius:999px;border:none;background:' + (window.__toggles.haltOnBreach ? 'var(--indigo)' : 'var(--chip-border)') + ';position:relative;"><span style="width:18px;height:18px;border-radius:999px;background:#F4F5F7;position:absolute;top:2px;left:' + (window.__toggles.haltOnBreach ? '20px' : '2px') + ';"></span></button></div>' +
      '</div>' +
      '<div class="span-4" style="display:flex;flex-direction:column;gap:16px;">' +
        '<div class="card" style="padding:22px 24px;">' +
          '<div class="h" style="font-size:16px;font-weight:600;margin-bottom:6px;">Notifications</div>' +
          '<div style="display:flex;gap:6px;margin-bottom:8px;">' +
            '<span class="chip" style="display:inline-flex;align-items:center;gap:4px;background:rgba(108,123,250,0.14);color:var(--indigo);">' + ICON.bell + ' Push</span>' +
            '<span class="chip" style="background:rgba(108,123,250,0.14);color:var(--indigo);">Email</span>' +
          '</div>' +
          notifRow('Signal pending approval', 'sigPending') + notifRow('Kill switch triggered', 'killAlert') + notifRow('Order failed', 'orderFailed') + notifRow('Daily loss limit hit', 'lossAlert') +
          '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--divider);font-size:12px;color:var(--sub);">Push → this device · Email → <span style="color:var(--text);font-weight:500;">aayan@example.com</span></div>' +
        '</div>' +
        '<div class="card" style="padding:22px 24px;flex:1;">' +
          '<div class="h" style="font-size:16px;font-weight:600;margin-bottom:4px;">Account</div>' +
          '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--divider);"><div style="display:flex;align-items:center;gap:8px;"><span style="width:8px;height:8px;border-radius:999px;background:var(--green-text);"></span><span style="font-size:13px;">Trading 212 — ISA</span></div><span style="font-size:11.5px;color:var(--sub);">Live · connected</span></div>' +
          '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;"><span style="font-size:13px;">Currency</span><span class="m" style="font-size:13px;color:var(--sub);">GBP</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="span-3 card-dark" style="padding:22px;display:flex;flex-direction:column;gap:14px;">' +
        '<div style="display:flex;align-items:center;gap:10px;"><div style="width:44px;height:44px;border-radius:999px;background:rgba(242,85,90,0.18);display:flex;align-items:center;justify-content:center;">' + ICON.kill + '</div>' +
        '<div><div class="h" style="font-size:16px;font-weight:600;">Kill switch</div><div style="font-size:11.5px;color:var(--sub-on-dark);">' + (state.kill ? 'On · orders halted' : 'Off · checked before every order') + '</div></div></div>' +
        '<button class="btn-ghost-danger" data-action="kill" style="' + (state.kill ? 'background:var(--danger);color:#fff;' : '') + '">' + (state.kill ? 'Resume trading' : 'Halt everything now') + '</button>' +
        '<div style="font-size:11.5px;line-height:1.5;color:var(--sub-on-dark);">Stops all order submission immediately, in both Demo and Live. Existing positions aren’t sold — only new orders are blocked.</div>' +
      '</div>' +
    '</div>';
  }
  function riskRow(label, value) {
    return '<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--divider);"><span style="font-size:13.5px;font-weight:500;">' + label + '</span><span class="m" style="font-size:13px;">' + value + '</span></div>';
  }
  function notifRow(label, key) {
    var on = window.__toggles[key];
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--divider);"><span style="font-size:13px;">' + label + '</span>' +
      '<button data-action="toggle-simple" data-id="' + key + '" style="width:36px;height:20px;border-radius:999px;border:none;background:' + (on ? 'var(--indigo)' : 'var(--chip-border)') + ';position:relative;"><span style="width:16px;height:16px;border-radius:999px;background:#F4F5F7;position:absolute;top:2px;left:' + (on ? '18px' : '2px') + ';"></span></button></div>';
  }
  window.__toggles = { haltOnBreach: true, sigPending: true, killAlert: true, orderFailed: true, lossAlert: true };

  /* ---------- root render ---------- */

  var VIEWS = { overview: renderOverview, approvals: renderApprovals, strategies: renderStrategies, backtest: renderBacktest, insights: renderInsights, history: renderHistory, settings: renderSettings };

  function render() {
    var app = document.getElementById('app');
    app.innerHTML = '<div class="shell">' + topbar() + killBanner() + VIEWS[state.view]() + '</div>' + bottomTabs();
    var ask = document.getElementById('ask-input');
    if (ask) { ask.focus(); ask.setSelectionRange(ask.value.length, ask.value.length); }
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  /* ---------- actions ---------- */

  function findPending(id) { for (var i = 0; i < PENDING.length; i++) if (PENDING[i].id === id) return i; return -1; }

  function approve(id) {
    if (state.kill) { toast('Kill switch is on — no orders can be submitted.'); return; }
    var i = findPending(id); if (i < 0) return;
    var s = PENDING[i];
    var st = stratById(s.stratId);
    var auto = st.approval === 'auto' || (st.approval === 'auto-above' && s.confidence >= st.threshold);
    PENDING.splice(i, 1);
    DECIDED.unshift({ ticker: s.ticker, action: s.action, qty: s.qty, stratName: st.name, status: auto ? 'Auto' : 'Executed', detail: (auto ? 'above its ' + st.threshold.toFixed(2) + ' threshold' : 'approved by you') + ' · filled at £' + s.price.toFixed(2) + ' · just now', note: s.note, outcome: '—', outcomeLabel: 'just opened', color: 'sub' });
    HISTORY_SEED.unshift({ date: 'Just now', ticker: s.ticker, strat: st.name, env: s.env, action: s.action + ' ' + s.qty, status: auto ? 'Auto' : 'Executed', outcome: '—', outcomeLabel: 'just opened', color: 'sub', note: s.note });
    toast(s.ticker + ' approved — order placed');
    if (state.openNoteId === id) state.openNoteId = null;
    render();
  }
  function reject(id) {
    var i = findPending(id); if (i < 0) return;
    var s = PENDING[i];
    var st = stratById(s.stratId);
    PENDING.splice(i, 1);
    var counterfactuals = ['would have: +£8.40', 'would have: −£5.60', 'would have: +£19.90'];
    var cf = counterfactuals[Math.floor(Math.random() * counterfactuals.length)];
    HISTORY_SEED.unshift({ date: 'Just now', ticker: s.ticker, strat: st.name, env: s.env, action: s.action + ' ' + s.qty, status: 'Rejected', outcome: cf, outcomeLabel: 'counterfactual, tracking forward', color: cf.indexOf('−') > -1 ? 'green' : 'pink', note: s.note });
    toast(s.ticker + ' rejected — tracked as a counterfactual in History');
    if (state.openNoteId === id) state.openNoteId = null;
    render();
  }

  function handleClick(e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');
    switch (action) {
      case 'nav': state.view = el.getAttribute('data-view'); window.scrollTo(0, 0); render(); break;
      case 'env': state.env = el.getAttribute('data-env'); render(); break;
      case 'kill': state.kill = !state.kill; toast(state.kill ? 'Kill switch engaged — all orders halted' : 'Kill switch reset'); render(); break;
      case 'theme': {
        var cur = document.documentElement.getAttribute('data-theme');
        var next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('loom-theme', next); } catch (err) {}
        render();
        break;
      }
      case 'approve': approve(id); break;
      case 'reject': reject(id); break;
      case 'note-toggle': state.openNoteId = state.openNoteId === id ? null : id; render(); break;
      case 'select-strategy': state.selectedStrategy = id; render(); break;
      case 'toggle-live': { var s1 = stratById(id); s1.live = !s1.live; render(); break; }
      case 'set-approval': { var s2 = stratById(id); s2.approval = el.getAttribute('data-mode'); render(); break; }
      case 'backtest-strategy': state.backtestStrategy = id; render(); break;
      case 'backtest-version': state.backtestVersion = id; render(); break;
      case 'backtest-window': state.backtestWindow = id; render(); break;
      case 'run-backtest': {
        state.backtestRunning = true; render();
        setTimeout(function () { state.backtestRunning = false; toast('Backtest complete'); render(); }, 500);
        break;
      }
      case 'insights-tab': state.insightsTab = id; render(); break;
      case 'ask': {
        var q = state.askText.trim();
        state.askAnswer = {
          title: q ? 'Here’s what the research turned up on that.' : 'VWRL is down about 1.2% on the week — mostly the dollar, not the companies.',
          body: q
            ? 'Sample response for “' + esc(q) + '” — in the real app this comes from Claude with web search, grounded in sources you can open.'
            : 'Roughly two-thirds of VWRL is US-listed, so a stronger pound this week mechanically lowered its GBP price even though the underlying index was flat to slightly up. For the Low-Vol Compounder’s thesis that’s neutral-to-mild positive.',
        };
        render();
        break;
      }
      case 'history-filter': state.historyEnvFilter = id; render(); break;
      case 'toggle-simple': window.__toggles[id] = !window.__toggles[id]; render(); break;
    }
  }

  function handleInput(e) {
    if (e.target.matches('[data-action="range"]')) {
      var st = stratById(e.target.getAttribute('data-id'));
      var kind = e.target.getAttribute('data-kind');
      var v = parseFloat(e.target.value);
      if (kind === 'threshold') st.threshold = v; else st.notify = v;
      var out = e.target.parentElement.querySelector('.m');
      if (out) out.textContent = v.toFixed(2);
      return;
    }
    if (e.target.matches('[data-action="note-input"]')) {
      var i = findPending(e.target.getAttribute('data-id'));
      if (i >= 0) PENDING[i].note = e.target.value;
      return;
    }
    if (e.target.id === 'ask-input') { state.askText = e.target.value; return; }
  }

  document.addEventListener('click', handleClick);
  document.addEventListener('input', handleInput);

  try {
    var saved = localStorage.getItem('loom-theme');
    if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
  } catch (err) {}

  render();
})();
</script>
