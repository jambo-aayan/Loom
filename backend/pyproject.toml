[project]
name = "loom"
version = "0.1.0"
description = "Loom: systematic Trading 212 trading bot core, API, and CLI"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "click>=8.1",
    "python-dateutil>=2.9",
    "anthropic>=0.25",
    "yfinance>=0.2.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
loom = "loom.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loom"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP042"]  # (str, Enum) mixin is intentional: plays well with SQLAlchemy's Enum type

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
